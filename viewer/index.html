<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Manager Clone - P0</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 1.2rem; font-weight: 500; margin: 12px 0 4px; }
    #canvas-wrap {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #3498db;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #2980b9; }
    #status {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
      min-height: 1em;
    }
    #score {
      font-size: 1rem;
      font-weight: 600;
      margin: 4px 0;
    }
    #progress-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 700px;
      max-width: 100%;
    }
    #progress-bar {
      flex: 1;
      accent-color: #3498db;
    }
    #progress-time {
      font-size: 0.8rem;
      color: #aaa;
      font-family: monospace;
      min-width: 110px;
      text-align: right;
    }
    #event-nav {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.85rem;
    }
    #event-nav input {
      width: 60px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
    }
    #event-indicator {
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    #event-info {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #9bd2ff;
      font-family: monospace;
      min-height: 1.2em;
    }
    #notice {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #ffd27d;
      min-height: 1.1em;
    }
    #observation {
      margin-top: 12px;
      width: 700px;
      max-width: 100%;
      font-size: 0.82rem;
      text-align: left;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      padding: 8px 10px;
    }
    #observation summary {
      cursor: pointer;
      font-weight: 600;
      color: #9bd2ff;
    }
    .obs-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .obs-row label {
      color: #bbb;
      font-size: 0.78rem;
    }
    .obs-row input[type="number"] { width: 60px; }
    .obs-row input[type="text"] { width: 140px; }
    .obs-row textarea {
      width: 100%;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px;
      font-family: inherit;
      resize: vertical;
    }
    .obs-row input {
      background: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px;
    }
    #obs-status {
      font-family: monospace;
      color: #ffd27d;
    }
    #obs-findings, #obs-report {
      margin-top: 8px;
      font-size: 0.8rem;
    }
    #obs-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .obs-entry {
      background: #18182c;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px 8px;
    }
    .obs-entry-head {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .obs-entry-time {
      font-family: monospace;
      color: #9bd2ff;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .obs-entry-statement {
      flex: 1;
      color: #ddd;
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 120px;
    }
    .obs-entry-badge {
      font-family: monospace;
      font-size: 0.68rem;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid #555;
      color: #ddd;
      white-space: nowrap;
    }
    .obs-badge-captured { background: #2a2a3a; color: #ccc; }
    .obs-badge-auditing { background: #1c3a5c; color: #9bd2ff; }
    .obs-badge-audit_ready { background: #1c4a44; color: #7fe3c8; }
    .obs-badge-diagnosing { background: #5c3a1c; color: #ffd27d; }
    .obs-badge-diagnosed { background: #1c5c2c; color: #8ef0a0; }
    .obs-badge-insufficient_evidence { background: #5c541c; color: #f5e37a; }
    .obs-badge-provider_unavailable { background: #3a2a5c; color: #c9a5f0; }
    .obs-badge-failed { background: #5c1c1c; color: #ff9d9d; }
    .obs-entry-body { margin-top: 4px; }
    .obs-entry-hint, .obs-entry-error, .obs-entry-progress {
      font-size: 0.75rem;
      color: #ffd27d;
      margin-top: 2px;
    }
    .obs-entry-error { color: #ff9d9d; }
    .obs-entry-cli {
      margin-top: 6px;
      background: #0d0d1a;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #9fd6a9;
    }
    .obs-entry-findings { margin-top: 6px; }
    .obs-entry-report {
      margin-top: 6px;
      white-space: pre-wrap;
      color: #9bd2ff;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .obs-entry-actions { margin-top: 6px; }
    .triage-head { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .triage-badge {
      font-family: monospace;
      font-size: 0.7rem;
      padding: 1px 10px;
      border-radius: 999px;
      border: 1px solid #555;
      color: #fff;
      white-space: nowrap;
    }
    .triage-bug { background: #8a2b2b; }
    .triage-design { background: #2b4a8a; }
    .triage-discuss { background: #8a7a2b; }
    .triage-rationale { color: #ddd; font-size: 0.78rem; }
    .next-steps-panel {
      margin-top: 6px;
      background: #10101f;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px 8px;
    }
    .next-steps-heading { color: #ffd27d; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; }
    .next-steps-item { color: #cfe6ff; font-size: 0.76rem; padding: 2px 0; }
    .next-steps-draft {
      margin: 4px 0;
      background: #0d0d1a;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #9fd6a9;
      max-height: 220px;
      overflow-y: auto;
    }
    #obs-next { margin-top: 8px; }
    .finding-item {
      background: #1e1e33;
      border-radius: 4px;
      padding: 4px 8px;
      margin-top: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .finding-item .jump-btn { font-size: 0.7rem; padding: 2px 8px; }
    #obs-report {
      white-space: pre-wrap;
      color: #9bd2ff;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Football Manager Clone — P0</h1>
  <div id="score">0 - 0</div>
  <div id="canvas-wrap"><canvas id="pitch" width="700" height="450"></canvas></div>
  <div id="progress-wrap">
    <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" />
    <span id="progress-time">0.0s / 0.0s</span>
  </div>
  <div id="controls">
    <button id="btn-toggle">⏯ 播放/暂停</button>
    <button id="btn-speed">速度 1x</button>
    <button id="btn-replay">↻ 重播</button>
  </div>
  <div id="event-nav">
    <button id="btn-prev-event">◀ 上一个</button>
    <span id="event-indicator">事件 -/-</span>
    <button id="btn-next-event">下一个 ▶</button>
    <label for="event-id-input">跳转 id:</label>
    <input id="event-id-input" type="number" min="0" value="0" />
    <button id="btn-jump-event">跳转</button>
  </div>
  <div id="event-info"></div>
  <div id="notice"></div>
  <div id="status">加载中…</div>

  <div id="observation">
    <details>
      <summary>观察采集 / 诊断 (P10)</summary>
      <div class="obs-row">
        <button id="btn-capture">⏸ 采集当前观察</button>
        <span id="obs-status">未采集</span>
      </div>
      <div class="obs-row">
        <label>自然语言描述</label>
        <textarea id="obs-statement" rows="2" placeholder="例如：传球时防守队员完全不干扰"></textarea>
      </div>
      <div class="obs-row">
        <label>before (s)</label>
        <input id="obs-before" type="number" min="0" value="5" />
        <label>after (s)</label>
        <input id="obs-after" type="number" min="0" value="5" />
        <label>选中实体 ids</label>
        <input id="obs-entities" type="text" placeholder="如 9,5（留空 = 当前事件参与者）" />
      </div>
      <div class="obs-row">
        <button id="btn-export-bundle">⬇ 导出 bundle</button>
        <button id="btn-submit">提交诊断</button>
      </div>
      <div class="obs-row">
        <label>观察列表（每次采集/提交一条；刷新后恢复，终态自动回填反馈）</label>
      </div>
      <div id="obs-list"></div>
      <div class="obs-row">
        <label>导入 audit/报告 JSON（CLI 回退）</label>
        <textarea id="obs-import" rows="3" placeholder="粘贴已保存的 audit / task / report JSON"></textarea>
        <button id="btn-import">导入</button>
      </div>
      <div id="obs-findings"></div>
      <div id="obs-report"></div>
      <div id="obs-next"></div>
    </details>
  </div>

  <!-- 版本号强制刷新 JS 模块缓存：改代码后改这里或清浏览器缓存 -->
  <script type="module" src="./app.js?v=20260826-12"></script>
</body>
</html>
