<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Manager Clone - P0</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 1.2rem; font-weight: 500; margin: 12px 0 4px; }
    #canvas-wrap {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    /* 数据源切换：引擎比赛 ↔ 真实比赛对照 */
    #data-source {
      margin-top: 4px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.82rem;
    }
    #data-source label { color: #bbb; font-size: 0.78rem; }
    #data-source select {
      background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 6px;
    }
    #tracking-select-wrap[hidden] { display: none; }
    #tracking-meta {
      margin-top: 4px;
      font-size: 0.74rem;
      color: #9bd2ff;
      font-family: monospace;
      min-height: 1.1em;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button:disabled:hover { background: #3498db; }
    button {
      background: #3498db;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #2980b9; }
    #status {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
      min-height: 1em;
    }
    #score {
      font-size: 1rem;
      font-weight: 600;
      margin: 4px 0;
    }
    #progress-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 700px;
      max-width: 100%;
    }
    #progress-bar {
      flex: 1;
      accent-color: #3498db;
    }
    #progress-time {
      font-size: 0.8rem;
      color: #aaa;
      font-family: monospace;
      min-width: 110px;
      text-align: right;
    }
    #event-nav {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.85rem;
    }
    #event-nav input {
      width: 60px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
    }
    #event-indicator {
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    #event-info {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #9bd2ff;
      font-family: monospace;
      min-height: 1.2em;
    }
    #notice {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #ffd27d;
      min-height: 1.1em;
    }
    #observation {
      margin-top: 12px;
      width: 700px;
      max-width: 100%;
      font-size: 0.82rem;
      text-align: left;
      border: 1px solid #3a3a55;
      border-radius: 6px;
      padding: 8px 10px;
    }
    #observation summary {
      cursor: pointer;
      font-weight: 600;
      color: #9bd2ff;
    }
    .obs-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .obs-row label {
      color: #bbb;
      font-size: 0.78rem;
    }
    .obs-row input[type="number"] { width: 60px; }
    .obs-row input[type="text"] { width: 140px; }
    .obs-row textarea {
      width: 100%;
      background: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px;
      font-family: inherit;
      resize: vertical;
    }
    .obs-row input {
      background: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px;
    }
    #obs-status {
      font-family: monospace;
      color: #ffd27d;
    }
    #obs-findings, #obs-report {
      margin-top: 8px;
      font-size: 0.8rem;
    }
    #obs-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .obs-entry {
      background: #18182c;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px 8px;
    }
    .obs-entry-head {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .obs-entry-time {
      font-family: monospace;
      color: #9bd2ff;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .obs-entry-statement {
      flex: 1;
      color: #ddd;
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 120px;
    }
    .obs-entry-badge {
      font-family: monospace;
      font-size: 0.68rem;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid #555;
      color: #ddd;
      white-space: nowrap;
    }
    .obs-badge-captured { background: #2a2a3a; color: #ccc; }
    .obs-badge-awaiting_confirmation { background: #3a2e0c; color: #ffd27d; }
    .obs-badge-confirmed { background: #1c4a44; color: #7fe3c8; }
    .obs-badge-auditing { background: #1c3a5c; color: #9bd2ff; }
    .obs-badge-audit_ready { background: #1c4a44; color: #7fe3c8; }
    .obs-badge-diagnosing { background: #5c3a1c; color: #ffd27d; }
    .obs-badge-diagnosed { background: #1c5c2c; color: #8ef0a0; }
    .obs-badge-insufficient_evidence { background: #5c541c; color: #f5e37a; }
    .obs-badge-provider_unavailable { background: #3a2a5c; color: #c9a5f0; }
    .obs-badge-failed { background: #5c1c1c; color: #ff9d9d; }
    .obs-entry-body { margin-top: 4px; }
    .obs-entry-hint, .obs-entry-error, .obs-entry-progress {
      font-size: 0.75rem;
      color: #ffd27d;
      margin-top: 2px;
    }
    .obs-entry-error { color: #ff9d9d; }
    /* P20 事件锚定确认面板 */
    .obs-confirm-head { font-size: 0.75rem; color: #cfe6ff; margin-top: 4px; }
    .obs-confirm-candidates { margin-top: 4px; }
    .obs-confirm-candidate {
      font-size: 0.74rem; color: #ddd; font-family: monospace;
      padding: 2px 0; border-bottom: 1px solid #2a2a44;
    }
    .obs-confirm-why { color: #9bd2ff; font-family: inherit; }
    .obs-confirm-drift { font-size: 0.74rem; color: #ffd27d; margin-top: 3px; }
    .obs-confirm-toggles { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .obs-confirm-toggle { font-size: 0.7rem; padding: 3px 8px; background: #2a2a44; border: 1px solid #3a3a55; }
    .obs-confirm-events {
      margin-top: 6px; max-height: 260px; overflow-y: auto;
      background: #10101f; border: 1px solid #3a3a55; border-radius: 4px; padding: 4px 6px;
    }
    .obs-confirm-event {
      display: flex; gap: 6px; align-items: center; cursor: pointer;
      font-size: 0.74rem; color: #ddd; font-family: monospace; padding: 2px 0;
    }
    .obs-confirm-empty { font-size: 0.72rem; color: #999; }
    .obs-confirm-actions { margin-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .obs-confirm-summary { font-size: 0.74rem; color: #9fd6a9; font-family: monospace; }
    .obs-confirm-submit { font-size: 0.72rem; padding: 4px 12px; background: #2b7a4b; }
    .obs-confirm-submit:disabled { opacity: 0.6; cursor: default; }
    .obs-entry-cli {
      margin-top: 6px;
      background: #0d0d1a;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #9fd6a9;
    }
    .obs-entry-findings { margin-top: 6px; }
    .obs-entry-report {
      margin-top: 6px;
      white-space: pre-wrap;
      color: #9bd2ff;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .obs-entry-actions { margin-top: 6px; }
    .triage-head { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .triage-badge {
      font-family: monospace;
      font-size: 0.7rem;
      padding: 1px 10px;
      border-radius: 999px;
      border: 1px solid #555;
      color: #fff;
      white-space: nowrap;
    }
    .triage-bug { background: #8a2b2b; }
    .triage-design { background: #2b4a8a; }
    .triage-discuss { background: #8a7a2b; }
    .triage-rationale { color: #ddd; font-size: 0.78rem; }
    .next-steps-panel {
      margin-top: 6px;
      background: #10101f;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px 8px;
    }
    .next-steps-heading { color: #ffd27d; font-size: 0.78rem; font-weight: 600; margin-bottom: 4px; }
    .next-steps-item { color: #cfe6ff; font-size: 0.76rem; padding: 2px 0; }
    .next-steps-draft {
      margin: 4px 0;
      background: #0d0d1a;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      padding: 6px;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: #9fd6a9;
      max-height: 220px;
      overflow-y: auto;
    }
    #obs-next { margin-top: 8px; }
    .finding-item {
      background: #1e1e33;
      border-radius: 4px;
      padding: 4px 8px;
      margin-top: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .finding-item .jump-btn { font-size: 0.7rem; padding: 2px 8px; }
    #obs-report {
      white-space: pre-wrap;
      color: #9bd2ff;
      font-family: monospace;
    }
    /* P11 问题管理视图 */
    #view-tabs { margin-top: 8px; display: flex; gap: 8px; }
    .view-tab { background: #2a2a44; border: 1px solid #3a3a55; }
    .view-tab.active { background: #3498db; border-color: #3498db; }
    #match-view { display: flex; flex-direction: column; align-items: center; width: 100%; }
    #match-view[hidden] { display: none; }
    #problem-view[hidden] { display: none; }
    #problem-view {
      margin-top: 12px;
      width: 700px;
      max-width: 100%;
      font-size: 0.82rem;
      text-align: left;
    }
    .problem-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .problem-toolbar label { color: #bbb; font-size: 0.78rem; }
    .problem-toolbar select {
      background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px;
    }
    #problem-status { color: #ffd27d; font-family: monospace; font-size: 0.75rem; }
    .problem-card {
      background: #18182c; border: 1px solid #3a3a55; border-radius: 4px;
      padding: 6px 8px; margin-bottom: 6px; cursor: pointer;
    }
    .problem-card:hover { border-color: #4a4a6a; }
    .problem-card-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .problem-card-title { flex: 1; color: #ddd; font-size: 0.8rem; min-width: 120px; }
    .problem-card-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 3px; font-size: 0.72rem; color: #999; }
    .problem-triage-badge {
      font-family: monospace; font-size: 0.7rem; padding: 1px 10px; border-radius: 999px;
      border: 1px solid #555; color: #fff; white-space: nowrap;
    }
    .problem-triage-bug { background: #8a2b2b; }
    .problem-triage-design { background: #2b4a8a; }
    .problem-triage-discuss { background: #8a7a2b; }
    .problem-triage-defer { background: #555; }
    .problem-triage-wontfix { background: #333; }
    .problem-status-badge {
      font-family: monospace; font-size: 0.68rem; padding: 1px 8px; border-radius: 999px;
      border: 1px solid #555; color: #ddd; white-space: nowrap;
    }
    .problem-status-open { background: #1c5c2c; color: #8ef0a0; }
    .problem-status-in_progress { background: #1c3a5c; color: #9bd2ff; }
    .problem-status-fixed { background: #1c4a44; color: #7fe3c8; }
    .problem-status-closed { background: #3a2a4a; color: #c9a5f0; }
    .problem-source { color: #999; font-size: 0.7rem; }
    .problem-ref { color: #ffd27d; font-size: 0.7rem; font-family: monospace; }
    .problem-time { color: #999; font-size: 0.7rem; font-family: monospace; white-space: nowrap; }
    .problem-issue-link { color: #7fe3c8; font-size: 0.72rem; text-decoration: none; }
    .problem-issue-link:hover { text-decoration: underline; }
    .problem-detail {
      background: #18182c; border: 1px solid #3a3a55; border-radius: 4px; padding: 8px 10px;
    }
    .problem-detail-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .problem-detail-title { font-size: 1rem; font-weight: 600; color: #eee; margin-bottom: 6px; }
    .problem-detail-desc { white-space: pre-wrap; color: #ddd; margin-bottom: 6px; }
    .problem-report {
      background: #0d0d1a; border: 1px solid #3a3a55; border-radius: 4px; padding: 6px;
      font-size: 0.72rem; white-space: pre-wrap; word-break: break-all; color: #9bd2ff;
      max-height: 260px; overflow-y: auto; margin-bottom: 6px;
    }
    .problem-section-heading { color: #ffd27d; font-size: 0.78rem; font-weight: 600; margin: 8px 0 4px; }
    .problem-decision-row, .problem-discussion-text { color: #cfe6ff; font-size: 0.76rem; padding: 2px 0; }
    .problem-decision-row { white-space: pre-wrap; word-break: break-all; }
    .problem-action-row {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px;
    }
    .problem-action-row label { color: #bbb; font-size: 0.78rem; }
    .problem-action-row input[type="text"] {
      background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 4px;
    }
    .problem-discussion-row { border-bottom: 1px solid #2a2a44; padding: 3px 0; }
    .problem-discussion-meta { color: #9bd2ff; font-size: 0.7rem; font-family: monospace; }
    .problem-decisions { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>Football Manager Clone — P0</h1>
  <div id="view-tabs">
    <button id="tab-match" class="view-tab active">比赛</button>
    <button id="tab-problems" class="view-tab">问题</button>
  </div>
  <div id="match-view">
  <div id="data-source">
    <label for="source-select">数据源</label>
    <select id="source-select">
      <option value="engine">我们引擎的比赛</option>
      <option value="tracking">真实比赛（对照）</option>
    </select>
    <span id="tracking-select-wrap" hidden>
      <label for="tracking-select">对照场次</label>
      <select id="tracking-select">
        <option value="metrica-game1">Metrica Sample Game 1</option>
        <option value="metrica-game2">Metrica Sample Game 2</option>
      </select>
    </span>
  </div>
  <div id="tracking-meta"></div>
  <div id="score">0 - 0</div>
  <div id="canvas-wrap"><canvas id="pitch" width="700" height="450"></canvas></div>
  <div id="progress-wrap">
    <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" />
    <span id="progress-time">0.0s / 0.0s</span>
  </div>
  <div id="controls">
    <button id="btn-toggle">⏯ 播放/暂停</button>
    <button id="btn-skip" title="跳过非精彩段：快进（连续画面）/ 直接跳（切到下一高亮）/ 关（全部播放）">跳过 快进5x</button>
    <button id="btn-speed" title="精彩段播放倍速：1x/2x/4x">倍速 1x</button>
    <button id="btn-replay">↻ 重播</button>
  </div>
  <div id="event-nav">
    <button id="btn-prev-event">◀ 上一个</button>
    <span id="event-indicator">事件 -/-</span>
    <button id="btn-next-event">下一个 ▶</button>
    <label for="event-id-input">跳转 id:</label>
    <input id="event-id-input" type="number" min="0" value="0" />
    <button id="btn-jump-event">跳转</button>
  </div>
  <div id="event-info"></div>
  <div id="notice"></div>
  <div id="status">加载中…</div>

  <div id="observation">
    <details>
      <summary>观察采集 / 诊断 (P10)</summary>
      <div class="obs-row">
        <button id="btn-capture">⏸ 采集当前观察</button>
        <span id="obs-status">未采集</span>
      </div>
      <div class="obs-row">
        <label>自然语言描述</label>
        <textarea id="obs-statement" rows="2" placeholder="例如：传球时防守队员完全不干扰"></textarea>
      </div>
      <div class="obs-row">
        <label>before (s)</label>
        <input id="obs-before" type="number" min="0" value="5" />
        <label>after (s)</label>
        <input id="obs-after" type="number" min="0" value="5" />
        <label>选中实体 ids</label>
        <input id="obs-entities" type="text" placeholder="如 9,5（留空 = 当前事件参与者）" />
      </div>
      <div class="obs-row">
        <button id="btn-export-bundle">⬇ 导出 bundle</button>
        <button id="btn-submit">提交诊断</button>
      </div>
      <div class="obs-row">
        <label>观察列表（每次采集/提交一条；刷新后恢复，终态自动回填反馈）</label>
      </div>
      <div id="obs-list"></div>
      <div class="obs-row">
        <label>导入 audit/报告 JSON（CLI 回退）</label>
        <textarea id="obs-import" rows="3" placeholder="粘贴已保存的 audit / task / report JSON"></textarea>
        <button id="btn-import">导入</button>
      </div>
      <div id="obs-findings"></div>
      <div id="obs-report"></div>
      <div id="obs-next"></div>
    </details>
  </div>
  </div>

  <div id="problem-view" hidden>
    <div class="problem-toolbar">
      <label>triage
        <select id="problem-filter-triage">
          <option value="">全部</option>
          <option value="bug">bug</option>
          <option value="design">design</option>
          <option value="discuss">discuss</option>
          <option value="defer">defer</option>
          <option value="wontfix">wontfix</option>
        </select>
      </label>
      <label>status
        <select id="problem-filter-status">
          <option value="">全部</option>
          <option value="open">open</option>
          <option value="in_progress">in_progress</option>
          <option value="fixed">fixed</option>
          <option value="closed">closed</option>
        </select>
      </label>
      <button id="problem-refresh">刷新</button>
      <button id="problem-import">导入历史任务</button>
      <span id="problem-status"></span>
    </div>
    <div id="problem-list"></div>
    <div id="problem-detail"></div>
  </div>

  <!-- 版本号强制刷新 JS 模块缓存：改代码后改这里或清浏览器缓存 -->
  <script type="module" src="./app.js?v=20260918-15"></script>
</body>
</html>
