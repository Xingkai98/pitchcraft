<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Manager Clone - P0</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 1.2rem; font-weight: 500; margin: 12px 0 4px; }
    #canvas-wrap {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    #controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #3498db;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #2980b9; }
    #status {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 8px;
      min-height: 1em;
    }
    #score {
      font-size: 1rem;
      font-weight: 600;
      margin: 4px 0;
    }
    #event-nav {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.85rem;
    }
    #event-nav input {
      width: 60px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
    }
    #event-indicator {
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    #event-info {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #9bd2ff;
      font-family: monospace;
      min-height: 1.2em;
    }
    #notice {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #ffd27d;
      min-height: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Football Manager Clone — P0</h1>
  <div id="score">0 - 0</div>
  <div id="canvas-wrap"><canvas id="pitch" width="700" height="450"></canvas></div>
  <div id="controls">
    <button id="btn-toggle">⏯ 播放/暂停</button>
    <button id="btn-speed">速度 1x</button>
    <button id="btn-replay">↻ 重播</button>
  </div>
  <div id="event-nav">
    <button id="btn-prev-event">◀ 上一个</button>
    <span id="event-indicator">事件 -/-</span>
    <button id="btn-next-event">下一个 ▶</button>
    <label for="event-id-input">跳转 id:</label>
    <input id="event-id-input" type="number" min="0" value="0" />
    <button id="btn-jump-event">跳转</button>
  </div>
  <div id="event-info"></div>
  <div id="notice"></div>
  <div id="status">加载中…</div>

  <!-- 版本号强制刷新 JS 模块缓存：改代码后改这里或清浏览器缓存 -->
  <script type="module" src="./app.js?v=20260805-4"></script>
</body>
</html>
